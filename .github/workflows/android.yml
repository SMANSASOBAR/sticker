name: Build Yosimora Sticker APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties bypass
      run: touch local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/Sticker Panel By Yosimora.apk"

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: Sticker Panel By Yosimora
        path: app/build/outputs/apk/debug/Sticker Panel By Yosimora.apk
        if-no-files-found: error
